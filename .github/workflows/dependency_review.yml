name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          license-check: false
          vulnerability-check: true
          show-openssf-scorecard: false
          show-patched-versions: true
          # GHSA-mh99-v99m-4gvg is already patched on 1.1.17/2.1.3, see
          # https://github.com/juliangruber/brace-expansion/security/advisories/GHSA-mh99-v99m-4gvg.
          # pnpm audit still flags it because npm's advisory flattens the patched versions
          # into one "<=5.0.7" range, which wrongly also catches 1.1.17/2.1.3.
          allow-ghsas: GHSA-mh99-v99m-4gvg
