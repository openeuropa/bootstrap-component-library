packages:
  - "bootstrap"
  - "builder"
  - "src/data/*"
  - "src/components/*"
  - "src/compositions/*"
  - "tools/**"
  - "src/themes/*"
  - "src/themes/**/storybook"

# pnpm 11 no longer reads npm's lifecycle-script configuration. Keep the
# corporate supply-chain policy enforced for local and CI installations.
ignoreScripts: true
minimumReleaseAge: 10080
# Reject dependency releases whose publishing trust evidence is weaker than
# an earlier release of the same package.
trustPolicy: no-downgrade
# These existing transitive versions predate this policy and currently have
# weaker registry trust evidence. Keep the exceptions version-specific so all
# future releases remain protected by the no-downgrade check.
trustPolicyExclude:
  - "@octokit/endpoint@9.0.6"
  - "chokidar@4.0.3"
  - "semver@5.7.2 || 6.3.1"
  - "ua-parser-js@1.0.41"
# Prevent transitive dependencies from introducing Git repositories or direct
# tarball URLs instead of packages from the configured registry.
blockExoticSubdeps: true

linkWorkspacePackages: true
nodeLinker: hoisted
packageImportMethod: clone-or-copy
publicHoistPattern:
  - "@openeuropa/*"

overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@rollup/plugin-terser>serialize-javascript': 7.0.5
  '@sigstore/core@<=3.2.0': 3.2.1
  '@xmldom/xmldom': 0.8.15
  '@istanbuljs/load-nyc-config>js-yaml': 3.15.1
  '@tootallnate/once': 3.0.1
  axios: 1.18.0
  basic-ftp: 5.3.1
  bn.js@5.2.2: 5.2.3
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'browserslist@<=4.28.6': 4.28.7
  crypto-js: 4.2.0
  copyfiles>minimatch: 3.1.4
  defu: 6.1.7
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  fast-uri: 3.1.6
  flatted: 3.4.2
  form-data: 4.0.6
  glob@10.4.5: 10.5.0
  glob@11.0.3: 11.1.0
  glob@7.2.3>minimatch: 3.1.4
  handlebars: 4.7.9
  immutable: 4.3.9
  'ip-address@<=10.3.0': 10.3.1
  js-yaml@3.14.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  locutus: 3.0.36
  lodash: 4.18.1
  merge: 2.1.1
  minimatch@10.1.1: 10.2.3
  minimatch@3.0.5: 3.1.4
  minimatch@3.1.4>brace-expansion: 1.1.18
  'nanoid@<3.3.18': 3.3.18
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  'nx@>=20.8.0 <22.7.7': 22.7.7
  nx>yaml: 2.8.3
  'pacote@>=11.2.7 <21.5.1': 21.5.1
  'postcss-selector-parser@>=7.1.0 <7.1.3': 7.1.3
  picomatch@<2.3.2: 2.3.2
  picomatch@>=4.0.0 <4.0.4: 4.0.4
  postcss: 8.5.25
  ajv@8.17.1: 8.18.0
  schema-utils@4.3.3>ajv: 8.18.0
  shell-quote: 1.10.0
  sigstore: 4.1.1
  socket.io-parser: 4.2.7
  svgo@^2.8.0: 2.8.3
  svgo@^4.0.0: 4.0.2
  tar: 7.5.22
  tar-fs: 3.1.1
  terser-webpack-plugin: 5.4.0
  tmp: 0.2.7
  undici: 6.28.0
  ws: 8.21.0
  yaml@2.8.1: 2.8.3

packageExtensions:
  "@storybook/addon-docs@*":
    dependencies:
      "@types/react": "^19.0.0"
  "@storybook/addon-webpack5-compiler-babel@*":
    dependencies:
      webpack: "^5.0.0"
  "storybook@*":
    dependencies:
      "@testing-library/dom": "^10.4.0"

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  nx: true
  unrs-resolver: true

patchedDependencies:
  locutus@3.0.36: patches/locutus@3.0.36.patch
  twing@7.3.1: patches/twing@7.3.1.patch

auditConfig:
  ignoreGhsas:
    # extract-zip symlink traversal; no fixed release published yet.
    - GHSA-jmr9-qjv8-65gv
