packages:
  - "bootstrap"
  - "builder"
  - "src/data/*"
  - "src/components/*"
  - "src/compositions/*"
  - "tools/**"
  - "src/themes/*"
  - "src/themes/**/storybook"

# pnpm 11 no longer reads npm's lifecycle-script configuration. Keep the
# corporate supply-chain policy enforced for local and CI installations.
ignoreScripts: true
minimumReleaseAge: 10080
# Reject dependency releases whose publishing trust evidence is weaker than
# an earlier release of the same package.
trustPolicy: no-downgrade
# These existing transitive versions predate this policy and currently have
# weaker registry trust evidence. Keep the exceptions version-specific so all
# future releases remain protected by the no-downgrade check.
trustPolicyExclude:
  - "@octokit/endpoint@9.0.6"
  - "chokidar@4.0.3"
  - "semver@5.7.2 || 6.3.1"
  - "ua-parser-js@1.0.41"
# Prevent transitive dependencies from introducing Git repositories or direct
# tarball URLs instead of packages from the configured registry.
blockExoticSubdeps: true

linkWorkspacePackages: true
nodeLinker: hoisted
packageImportMethod: clone-or-copy
publicHoistPattern:
  - "@openeuropa/*"

# Keep security overrides needed by the current dependency graph.
overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@istanbuljs/load-nyc-config>js-yaml': 3.15.2
  '@tootallnate/once': 3.0.1
  'axios@<1.20.0': 1.20.0
  'basic-ftp@<6.2.1': 6.2.1
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=3.0.0 <5.0.12': 5.0.12
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  'ip-address@<10.7.1': 10.7.1
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Must match the export compatibility patch in patchedDependencies.
  locutus: 3.0.36
  minimatch@3.1.4>brace-expansion: 1.1.21
  'nanoid@<3.3.18': 3.3.18
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  'pacote@>=11.2.7 <21.5.1': 21.5.1
  # Upgrade older PostCSS without downgrading newer direct dependencies.
  'postcss@<8.5.25': ^8.5.25
  'smol-toml@<1.7.1': 1.7.1
  tar: 7.5.22
  'webpack-dev-middleware@<7.4.5': 7.4.5
  ws: 8.21.0

packageExtensions:
  "@storybook/addon-docs@*":
    dependencies:
      "@types/react": "^19.0.0"
  "@storybook/addon-webpack5-compiler-babel@*":
    dependencies:
      webpack: "^5.0.0"
  "storybook@*":
    dependencies:
      "@testing-library/dom": "^10.4.0"

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  nx: true
  unrs-resolver: true

patchedDependencies:
  locutus@3.0.36: patches/locutus@3.0.36.patch
  twing@7.3.1: patches/twing@7.3.1.patch

auditConfig:
  ignoreGhsas:
    # extract-zip symlink traversal; no fixed release published yet.
    - GHSA-jmr9-qjv8-65gv
